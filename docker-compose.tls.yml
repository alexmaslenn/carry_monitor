# TLS overlay. Apply on top of the base file once a hostname and a Cloudflare
# token exist:
#
#   docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d
#
# Needs, in .env:
#   GRAFANA_HOSTNAME  an A record pointing at this box
#   ACME_EMAIL        Let's Encrypt contact address
#   CF_API_TOKEN      Cloudflare token, Zone:DNS:Edit on that zone ONLY
#
# `command` and `labels` are written out in full rather than as additions.
# Compose replaces a service's command outright when an override defines one, so
# a partial list here would silently drop the base flags.

services:
  carry_grafana:
    environment:
      # Grafana derives redirects and asset URLs from this. Left at http:// it
      # bounces you between schemes on login instead of failing visibly.
      GF_SERVER_ROOT_URL: https://${GRAFANA_HOSTNAME}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=carry_monitor_carry_net"
      - "traefik.http.services.carrygrafana.loadbalancer.server.port=3000"
      - "traefik.http.routers.carrygrafana.service=carrygrafana"
      # A certificate is issued for a name, so the catch-all PathPrefix rule the
      # base file uses for raw-IP access is replaced by a Host rule here.
      - "traefik.http.routers.carrygrafana.rule=Host(`${GRAFANA_HOSTNAME}`)"
      - "traefik.http.routers.carrygrafana.entrypoints=websecure"
      - "traefik.http.routers.carrygrafana.tls=true"
      - "traefik.http.routers.carrygrafana.tls.certresolver=carryresolver"
      # Plain HTTP now exists only to redirect.
      - "traefik.http.routers.carrygrafana-http.rule=Host(`${GRAFANA_HOSTNAME}`)"
      - "traefik.http.routers.carrygrafana-http.entrypoints=web"
      - "traefik.http.routers.carrygrafana-http.middlewares=carry-to-https"
      - "traefik.http.middlewares.carry-to-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.carry-to-https.redirectscheme.permanent=true"

  carry_traefik:
    command:
      - "--log.level=WARN"
      - "--accesslog=true"
      - "--ping=true"
      - "--ping.entrypoint=ping"
      - "--entryPoints.ping.address=:8082"
      - "--entryPoints.web.address=:80"
      - "--entryPoints.websecure.address=:443"
      - "--providers.docker=true"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--providers.docker.exposedByDefault=false"
      - "--certificatesResolvers.carryresolver.acme.email=${ACME_EMAIL}"
      - "--certificatesResolvers.carryresolver.acme.storage=/letsencrypt/acme.json"
      # DNS challenge, as aegis_monitor uses. It does not need port 80 reachable
      # from the internet, so the security group can stay closed to everything
      # except your own address.
      - "--certificatesResolvers.carryresolver.acme.dnsChallenge.provider=cloudflare"
    environment:
      - CLOUDFLARE_DNS_API_TOKEN=${CF_API_TOKEN}
    ports:
      - "80:80"
      - "443:443"
