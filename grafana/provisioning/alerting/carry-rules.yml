# Alert rules, provisioned from disk like the dashboards.
#
# Chosen on one principle: every failure this book has produced was SILENT. None
# of them raised an error - a wrong target sign, a dropped position feed, a
# 217 ms clock drift, an unreachable scrape target. Each looked exactly like
# nothing happening. So these rules watch for the ABSENCE of health, not for
# errors.
#
# Deliberately NOT included:
#
#   carry_seconds_since_action - it reads 0 when the strategy has never acted,
#   and a healthy book that has reached its target correctly does nothing for
#   hours. Alerting on it would fire on the normal steady state, and a rule that
#   cries wolf is worse than no rule. It stays a diagnostic on the dashboard.
#
# Notifications: these route to the default contact point, which has no delivery
# configured, so they will show as Firing in the UI and go nowhere else. Add a
# contact point (email/Telegram/Slack) before relying on them.

apiVersion: 1

groups:
  - orgId: 1
    name: carry-integrity
    folder: Carry
    interval: 1m
    rules:

      # ---------------------------------------------------------------------
      # Is anything watching at all?
      #
      # First rule for a reason: if the monitor is dead, every other rule here
      # goes quiet too, and quiet is what all of them use to mean healthy.
      - uid: carry-monitor-dead
        title: Carry monitor is not running
        condition: C
        for: 5m
        noDataState: Alerting
        execErrState: Alerting
        labels:
          severity: critical
        annotations:
          summary: No carry_heartbeat row for over 5 minutes
          description: >-
            The monitor writes a heartbeat every minute whether or not anything
            changed. A stale one means collection has stopped, and a book with no
            monitoring looks identical to a book with nothing happening. Check
            `docker logs carry_monitor`.
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: carry-timescale
            model:
              refId: A
              format: table
              rawQuery: true
              rawSql: >-
                SELECT EXTRACT(EPOCH FROM (NOW() - MAX(time))) AS age_seconds
                FROM carry_heartbeat
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [300] }

      # ---------------------------------------------------------------------
      # Is it collecting on complete data?
      - uid: carry-sources-degraded
        title: Carry monitor is degraded
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Alerting
        labels:
          severity: warning
        annotations:
          summary: A data source has been failing for 10 minutes
          description: >-
            sources_failed is non-empty, so at least one venue, Prometheus or the
            registry is unreachable. The instrument list is held by the registry
            so collection continues, but it is running on partial data. The
            heartbeat row names which source.
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: carry-timescale
            model:
              refId: A
              format: table
              rawQuery: true
              rawSql: >-
                SELECT COUNT(*) AS failing FROM carry_heartbeat
                WHERE time > NOW() - INTERVAL '10 minutes'
                  AND sources_failed <> ''
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [8] }

      # ---------------------------------------------------------------------
      # Is Prometheus still reaching the robot?
      #
      # Without this, losing the scrape silently disarms every Prometheus rule
      # below - they go to NoData, which is not Alerting, and the book runs
      # unwatched while the dashboards look merely empty.
      - uid: carry-robot-unreachable
        title: Robot metrics endpoint is unreachable
        condition: C
        for: 5m
        noDataState: Alerting
        execErrState: Alerting
        labels:
          severity: critical
        annotations:
          summary: Prometheus cannot scrape the trading box
          description: >-
            Target carry_tokyo:9702 is down. The robot may be fine - this is the
            monitoring path failing - but every rule that reads robot metrics is
            blind until it is fixed. Check the security group, ROBOT_SERVER_IP,
            and that Cell is running. Note the endpoint answers only requests
            addressed to the name carry_tokyo; by IP it returns 404.
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: carry-prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: min(up{job="carry_robot"})
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: lt, params: [1] }

      # ---------------------------------------------------------------------
      # Is the book actually hedged?
      #
      # THE one that matters. An inverted target sign left a naked $20 perp leg
      # with the spot leg rejecting every order, for six minutes, and nothing
      # anywhere reported it. Delta was ~20 the whole time.
      - uid: carry-delta-breach
        title: Carry hedge is broken
        condition: C
        for: 10m
        noDataState: NoData
        execErrState: Alerting
        labels:
          severity: critical
        annotations:
          summary: Net delta has exceeded the threshold for 10 minutes
          description: >-
            abs(carry_delta_usd) is above DeltaDiscrepancyThresholdUSD and has
            stayed there, so the strategy has had several action rounds and has
            not closed it - it cannot correct this on its own. Usual causes: one
            leg rejecting orders (insufficient balance, below venue minimum), or
            a target the strategy cannot express. Check the legs panel to see
            which side is missing.
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: carry-prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: max(abs(carry_delta_usd)) by (asset)
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [12] }

      # ---------------------------------------------------------------------
      # Has the strategy given up?
      - uid: carry-halted
        title: Carry strategy has halted
        condition: C
        for: 2m
        noDataState: NoData
        execErrState: Alerting
        labels:
          severity: critical
        annotations:
          summary: carry_halted is set - the strategy stopped acting on this asset
          description: >-
            The ineffective-send fuse tripped: repeated rounds changed nothing,
            so the strategy stopped rather than loop. Whatever delta exists is
            now frozen and nobody is correcting it. This needs a human.
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: carry-prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: max(carry_halted) by (asset)
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0] }

      # ---------------------------------------------------------------------
      # Leading indicator for order rejections.
      - uid: carry-clock-drift
        title: Clock drift against the venue
        condition: C
        for: 10m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: binance_timeshift beyond 100 ms
          description: >-
            recvWindow is spent on one-way latency PLUS this offset, so drift
            here precedes -1021 "Timestamp outside recvWindow" rejections - which
            present as a strategy that silently never fills, not as a clock
            problem. A 217 ms drift from an unsynced clock once broke every order
            on this book. Check `chronyc tracking` on the trading box.
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: carry-prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: max(abs(binance_timeshift))
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [100] }

      # ---------------------------------------------------------------------
      # Has a venue stopped sending market data?
      #
      # The strategy prices both legs from quotes. With none arriving it holds
      # the last price it saw, so a dead feed does not stop it - it makes it size
      # against a stale market, and the process looks entirely healthy while
      # doing so.
      #
      # NOT md_HL_quotes / md_BINANCES_quotes, despite the name. Those read 0 on
      # a running robot - nothing increments them - so a rule on them would fire
      # forever. connector_messages carries the count that actually moves, and it
      # labels the venue instead of baking it into the metric name, so this one
      # rule covers a venue added later without being edited.
      - uid: carry-quotes-stopped
        title: Market data has stopped from a venue
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Alerting
        labels:
          severity: critical
        annotations:
          summary: No quotes from {{ $labels.market }} for several minutes
          description: >-
            connector_messages{type="quotes"} has been flat for this venue. Crypto
            venues do not close, so this is a dead subscription or a dropped
            socket, not a quiet market. The strategy keeps pricing off the last
            quote it received, so it will go on sizing and hedging against a
            market that has moved without it. Check the connector on the trading
            box; account_connectors_up shows whether the account link is also
            down or only the feed.
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: carry-prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: sum(rate(connector_messages{type="quotes"}[5m])) by (market)
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: lt, params: [0.01] }

      # ---------------------------------------------------------------------
      # Can the engine still act on this account?
      #
      # Distinct from the quotes rule above, and the pair matters. Market data
      # and the account link are different connections: quotes can keep arriving
      # while orders cannot be placed at all. That combination is the dangerous
      # one, because every dashboard keeps updating and the strategy keeps
      # deciding - it simply cannot execute any of it.
      #
      # account_connectors_up is a COUNT, not a flag: Account.cs increments it on
      # connect and decrements on disconnect, so it reads 1 for each of these
      # accounts because each has one connector. Zero means that whole leg is
      # unreachable.
      - uid: carry-account-link-down
        title: Account connector is down
        condition: C
        for: 3m
        noDataState: OK
        execErrState: Alerting
        labels:
          severity: critical
        annotations:
          summary: No connector online for account {{ $labels.account }}
          description: >-
            The engine cannot place or cancel orders on this account. If the
            other leg is still live the book is unhedgeable rather than merely
            idle - a move now cannot be corrected on this side. Reconnects are
            normal and brief, so this only fires after three minutes; anything
            longer is an outage, an expired credential, or an IP restriction that
            no longer matches this box.
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: carry-prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: min(account_connectors_up) by (account)
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: lt, params: [1] }

      # ---------------------------------------------------------------------
      # Are orders being refused?
      #
      # The gap this closes: an inverted target left the spot leg rejecting every
      # order it sent - insufficient balance, six times in six minutes - while the
      # perp leg sat filled and unhedged. Nothing counted it. The only trace was
      # a log line nobody was reading.
      #
      # The counter is NOT in acc_orders, which only has state gauges (active,
      # pending, incomplete...). Rejections are registered as children of the
      # order_delay histogram, so order_delay_count with type=reject is the count
      # (Account.cs:959). type=reject is the venue refusing; type=reject_local is
      # the engine's own guard declining to send.
      #
      # increase() over 10 minutes rather than a bare rate, so one transient
      # refusal does not page: three in ten minutes is a strategy that cannot
      # place what it wants, not bad luck.
      - uid: carry-orders-rejected
        title: Orders are being rejected
        condition: C
        for: 2m
        noDataState: OK
        execErrState: Alerting
        labels:
          severity: critical
        annotations:
          summary: Repeated order rejections on account {{ $labels.account }}
          description: >-
            The strategy is sending orders the venue or the engine will not
            accept, so it is trying to correct something and failing. Check the
            Cell log for the reason - insufficient balance, below the venue
            minimum, or -1021 timestamp errors are the usual three. Watch the
            legs panel at the same time: rejections on one leg while the other is
            filled means the book is unhedged for as long as this continues.
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: carry-prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: sum(increase(order_delay_count{type=~"reject|reject_local"}[10m])) by (account, type)
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [2] }

      # ---------------------------------------------------------------------
      # Does the engine's view of a venue match an independent reading of it?
      #
      # The real integrity check, and the one acc_position local-vs-remote only
      # appeared to be. Two genuinely separate paths: the engine over its own
      # websocket with the trading key, this monitor over REST with a read-only
      # key. Nothing shared, so a disagreement is real information.
      #
      # NULL rows - the engine's view could not be read - are excluded rather
      # than counted as zero. Counting them as agreement is the failure this
      # whole stack keeps running into: an absence of data presented as a
      # healthy result.
      - uid: carry-engine-vs-venue
        title: Engine disagrees with an independent read of the venue
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Alerting
        labels:
          severity: critical
        annotations:
          summary: Engine position differs from the monitor's own venue read
          description: >-
            The trading engine believes it holds something different from what
            the venue tells this process directly. The strategy sizes from the
            engine's view, so while this persists it is trading against a
            position that does not exist. Ten minutes rules out the normal skew
            around a fill. Compare the engine's number on the robot dashboard
            against the leg quantities here, and stop the book before it acts
            again if they still differ.
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: carry-timescale
            model:
              refId: A
              format: table
              rawQuery: true
              rawSql: >-
                SELECT COALESCE(MAX(ABS((data->>'engine_diff_usd')::float8)), 0)
                       AS worst_usd
                FROM carry_leg_time
                WHERE time > NOW() - INTERVAL '10 minutes'
                  AND data->>'engine_diff_usd' IS NOT NULL
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [5] }

      # ---------------------------------------------------------------------
      # Engine's own tally vs what the venue reports.
      #
      # noDataState is OK on purpose. acc_position{type="local"} is created only
      # when a fill is handled (Account.cs), so before the first fill after a
      # restart the join produces nothing. Treating that emptiness as an alert
      # would fire on every restart and train everyone to ignore this rule - and
      # this is the rule that catches missed fills, which is what let a strategy
      # re-send the same order 25 times against a position reading 0.
      - uid: carry-position-drift
        title: Fill not reflected within a sync interval
        condition: C
        for: 5m
        noDataState: OK
        execErrState: OK
        labels:
          # Downgraded from critical. It was labelled critical on the belief that
          # it verified fills independently, which it does not - a quiet rule
          # here proves nothing, so paging on it would be paging on noise.
          severity: warning
        annotations:
          summary: acc_position local and remote disagree for longer than a sync
          description: >-
            NARROW BY CONSTRUCTION - read the panel description before acting.
            local is not an independent tally: the connectors set Force=true on
            position events, so Synchronize() assigns CalculatedVolume from the
            venue every sync. A gap therefore cannot persist, and this rule can
            only catch a fill that has not been reflected within one interval.
            It does NOT prove fills are counted correctly, and a quiet rule here
            is not assurance. Independent verification needs a second reader of
            the venue, which is what the monitor's own position collection is.
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: carry-prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: >-
                max(abs(acc_position{type="remote"}
                  - on(instance, account, symbol)
                    acc_position{type="local"}))
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0.5] }
