# Scrapes the Cell trading process. The engine ships a Prometheus endpoint
# (Tram.Kit.Metrics.PrometheusMetricsCollector) - it just has to be enabled in
# the Cell appsettings with a Metrics section carrying Host and Port.
#
# TARGETS ARE NAMES, NOT ADDRESSES. `carry_tokyo` is resolved by an extra_hosts
# entry on the prometheus service in docker-compose.yml, fed from ROBOT_SERVER_IP
# in .env - the same way aegis_monitor resolves okx_colo and jlp_okx_colo.
#
# The point is that `instance` stays a stable, readable name. It is baked into
# every stored series, so if the target were a raw address, replacing the trading
# box would silently split the history in two: old series under the old address,
# new ones under the new one, and no panel joining across them. Keeping the
# address in .env means moving a box is one line there and nothing else.
global:
  scrape_interval: 10s

scrape_configs:
  - job_name: 'carry_robot'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['carry_tokyo:9702']
        labels:
          # Which book. Same value as the `setup` column in carry_leg_time, so
          # the robot dashboard and the risk dashboard filter on one identifier.
          setup: 'carry'
          # Which machine runs it. Kept separate from setup because a setup can
          # move between boxes, and a box can end up running more than one.
          host: 'carry_tokyo'
