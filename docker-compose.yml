# Self-contained monitoring stack for the carry book.
#
# Deliberately SEPARATE from the aegis_monitor stack - its own Grafana, its own
# Prometheus, its own database - so nothing here touches the production
# monitoring instance. The shape follows aegis_monitor's, because that one works:
# Traefik in front with Let's Encrypt over a DNS challenge, and Grafana keeping
# its state in Postgres rather than a container volume.
#
# Wants ~6 GB, so t3.large. See DEPLOY.md.

networks:
  carry_net:

volumes:
  carry_ts_data:
  carry_prom_data:

services:
  carry_timescale:
    image: timescale/timescaledb:latest-pg16
    container_name: carry_timescale
    restart: unless-stopped
    networks: [carry_net]
    environment:
      POSTGRES_DB: ${TS_DB_NAME}
      POSTGRES_USER: ${TS_DB_USER}
      POSTGRES_PASSWORD: ${TS_DB_PASSWORD}
    command: postgres -c shared_preload_libraries=timescaledb
    volumes:
      - carry_ts_data:/var/lib/postgresql/data
      # Mounted as INDIVIDUAL files - never as ./sql:/docker-entrypoint-initdb.d.
      # The timescaledb image ships its own 000_install_timescaledb.sh in that
      # directory; mounting a directory over it shadows those scripts, so the
      # extension is never created and 001 dies with
      #   ERROR: function by_range(unknown) does not exist
      # which aborts init and leaves the container stopped. The 1xx prefixes keep
      # ours running after the image's own, on FIRST start only.
      - ./sql/000_grafana_db.sql:/docker-entrypoint-initdb.d/100_grafana_db.sql:ro
      - ./sql/001_carry.sql:/docker-entrypoint-initdb.d/101_carry.sql:ro
      - ./sql/002_registry.sql:/docker-entrypoint-initdb.d/102_registry.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TS_DB_USER} -d ${TS_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Loopback only. Nothing off-box needs the database, and an exposed Postgres
    # is how monitoring hosts get owned.
    ports:
      - "127.0.0.1:5433:5432"

  carry_prometheus:
    image: prom/prometheus:latest
    container_name: carry_prometheus
    restart: unless-stopped
    networks: [carry_net]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - carry_prom_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROM_RETENTION:-90d}"
    # Resolves the symbolic target names in prometheus.yml, so the scrape config
    # never contains an address and `instance` stays a stable label across box
    # moves. Same mechanism aegis_monitor uses for okx_colo / jlp_okx_colo.
    extra_hosts:
      carry_tokyo: "${ROBOT_SERVER_IP}"
    # Loopback only - reach it over an ssh tunnel. Prometheus has no auth.
    ports:
      - "127.0.0.1:9091:9090"

  carry_grafana:
    image: grafana/grafana:11.4.0
    container_name: carry_grafana
    restart: unless-stopped
    networks: [carry_net]
    depends_on:
      carry_timescale:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://${GRAFANA_HOSTNAME}
      # State in Postgres, not the container filesystem - the same choice
      # aegis_monitor makes. Dashboards, users, annotations and alert rules then
      # survive a rebuild and can be moved between hosts with pg_dump, which is
      # exactly how Grafana is migrated between monitoring1 and monitoring2.
      GF_DATABASE_TYPE: postgres
      GF_DATABASE_HOST: carry_timescale:5432
      GF_DATABASE_NAME: grafana
      GF_DATABASE_USER: ${TS_DB_USER}
      GF_DATABASE_PASSWORD: ${TS_DB_PASSWORD}
      GF_DATABASE_SSL_MODE: disable
      # Consumed by the provisioned datasource.
      TS_DB_HOST: carry_timescale
      TS_DB_PORT: "5432"
      TS_DB_NAME: ${TS_DB_NAME}
      TS_DB_USER: ${TS_DB_USER}
      TS_DB_PASSWORD: ${TS_DB_PASSWORD}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    # No published port: Traefik reaches it over the docker network, so Grafana
    # is never directly exposed.
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=carry_monitor_carry_net"
      - "traefik.http.services.carrygrafana.loadbalancer.server.port=3000"
      - "traefik.http.routers.carrygrafana.rule=Host(`${GRAFANA_HOSTNAME}`)"
      - "traefik.http.routers.carrygrafana.entrypoints=websecure"
      - "traefik.http.routers.carrygrafana.tls=true"
      - "traefik.http.routers.carrygrafana.tls.certresolver=carryresolver"
      - "traefik.http.routers.carrygrafana.service=carrygrafana"
      # Plain HTTP exists only to redirect. This dashboard shows positions and
      # P&L and should never be served unencrypted.
      - "traefik.http.routers.carrygrafana-http.rule=Host(`${GRAFANA_HOSTNAME}`)"
      - "traefik.http.routers.carrygrafana-http.entrypoints=web"
      - "traefik.http.routers.carrygrafana-http.middlewares=carry-to-https"
      - "traefik.http.middlewares.carry-to-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.carry-to-https.redirectscheme.permanent=true"

  carry_traefik:
    image: traefik:latest
    container_name: carry_traefik
    restart: unless-stopped
    networks: [carry_net]
    command:
      - "--log.level=WARN"
      - "--accesslog=true"
      - "--ping=true"
      - "--ping.entrypoint=ping"
      - "--entryPoints.ping.address=:8082"
      - "--entryPoints.web.address=:80"
      - "--entryPoints.websecure.address=:443"
      - "--providers.docker=true"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      # Nothing is routed unless it opts in with a label.
      - "--providers.docker.exposedByDefault=false"
      - "--certificatesResolvers.carryresolver.acme.email=${ACME_EMAIL}"
      - "--certificatesResolvers.carryresolver.acme.storage=/letsencrypt/acme.json"
      # DNS challenge, as aegis_monitor uses. It does not require port 80 to be
      # reachable from the internet, so the security group can stay closed to
      # everything except your own address.
      - "--certificatesResolvers.carryresolver.acme.dnsChallenge.provider=cloudflare"
    environment:
      - CLOUDFLARE_DNS_API_TOKEN=${CF_API_TOKEN}
    volumes:
      # Read-only: Traefik only needs to watch for container labels. The docker
      # socket is root on the host, so never mount it writable.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./letsencrypt:/letsencrypt
    ports:
      - "80:80"
      - "443:443"
    healthcheck:
      test: ["CMD", "wget", "http://localhost:8082/ping", "--spider", "-q"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  carry_monitor:
    build: .
    image: carry_monitor:latest
    container_name: carry_monitor
    restart: unless-stopped
    networks: [carry_net]
    depends_on:
      carry_timescale:
        condition: service_healthy
    env_file: .env
    environment:
      TS_DB_HOST: carry_timescale
      TS_DB_PORT: "5432"
      CARRY_PROMETHEUS_URL: http://carry_prometheus:9090
