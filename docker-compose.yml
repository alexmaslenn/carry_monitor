# Self-contained monitoring stack for the carry book.
#
# Deliberately SEPARATE from the aegis_monitor stack: its own Grafana, its own
# Prometheus, its own database. Nothing here touches the production monitoring
# instance.
#
# To read from the existing TimescaleDB instead of the bundled one, point
# TS_DB_HOST at it in .env and comment out the timescaledb service below.

networks:
  carry_net:

volumes:
  carry_ts_data:
  carry_prom_data:
  carry_grafana_data:

services:
  # Bundled database, OPT-IN. On a 4 GB box (t3.medium) running this alongside
  # Prometheus and Grafana is tight; point TS_DB_HOST at an existing TimescaleDB
  # instead and leave this off. Start it with:  docker compose --profile bundled-db up -d
  carry_timescale:
    image: timescale/timescaledb:latest-pg16
    container_name: carry_timescale
    restart: unless-stopped
    profiles: ["bundled-db"]
    networks: [carry_net]
    environment:
      POSTGRES_DB: ${TS_DB_NAME}
      POSTGRES_USER: ${TS_DB_USER}
      POSTGRES_PASSWORD: ${TS_DB_PASSWORD}
    command: postgres -c shared_preload_libraries=timescaledb
    volumes:
      - carry_ts_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432"

  carry_prometheus:
    image: prom/prometheus:latest
    container_name: carry_prometheus
    restart: unless-stopped
    networks: [carry_net]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - carry_prom_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9091:9090"

  carry_grafana:
    image: grafana/grafana:11.4.0
    container_name: carry_grafana
    restart: unless-stopped
    networks: [carry_net]
    depends_on: [carry_prometheus]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD}
      TS_DB_HOST: ${TS_DB_HOST}
      TS_DB_PORT: ${TS_DB_PORT}
      TS_DB_NAME: ${TS_DB_NAME}
      TS_DB_USER: ${TS_DB_USER}
      TS_DB_PASSWORD: ${TS_DB_PASSWORD}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - carry_grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"

  carry_monitor:
    build: .
    image: carry_monitor:latest
    container_name: carry_monitor
    restart: unless-stopped
    networks: [carry_net]
    env_file: .env
